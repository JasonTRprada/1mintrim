<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paws Arcana · Shared Reading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#423757;--lav:#8370a8;--cream:#fffaf4;--line:#e9d8d0;--rose:#a77e85}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 70% 9%,#f5eafb 0,transparent 23rem),linear-gradient(180deg,#fffdf9,#fff8f1);font-family:"DM Sans","Noto Sans KR","Malgun Gothic",sans-serif}.nav{max-width:1100px;height:82px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:500 24px "Playfair Display",serif;color:inherit;text-decoration:none}.nav a:last-child{color:#705b8e;text-decoration:none;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:70px 28px 96px}.eyebrow{color:var(--rose);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.head{text-align:center}.head h1{margin:13px 0 10px;font:500 clamp(42px,6vw,72px)/.95 "Playfair Display",serif;letter-spacing:-.06em}.head p{color:#756984}.question{max-width:750px;margin:35px auto 43px;padding:18px 20px;border-left:3px solid #b79ccb;border-radius:0 16px 16px 0;background:#f2ebf7;color:#655771;line-height:1.65}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;max-width:820px;margin:auto}.card-item{text-align:center}.pos{margin-bottom:12px;color:#9d7781;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.card-item img{display:block;width:min(100%,235px);aspect-ratio:2/3;object-fit:cover;margin:auto;border-radius:15px;box-shadow:0 18px 32px rgba(79,51,88,.2)}.card-item h2{margin:12px 0 0;font:500 21px "Playfair Display",serif}.reading{max-width:820px;margin:54px auto 0;padding:30px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.66)}.reading h2{margin:0 0 12px;font:500 36px "Playfair Display",serif}.block{margin:22px 0 0;padding-top:18px;border-top:1px solid var(--line)}.block:first-of-type{border-top:0;padding-top:0}.block h3{margin:0 0 8px;color:var(--rose);font-size:11px;letter-spacing:.14em;text-transform:uppercase}.block p{margin:0;color:#6c6278;line-height:1.8;white-space:pre-line}.notice,.error{max-width:650px;margin:80px auto;padding:25px;border-radius:18px;text-align:center;background:#f4edf8;color:#655771}.error{background:#fff0ef;color:#965263}@media(max-width:650px){.nav{padding:0 20px}.wrap{padding:50px 18px}.cards{gap:8px}.card-item img{border-radius:10px}.card-item h2{font-size:15px}.reading{padding:22px}.reading h2{font-size:30px}}
  </style>
</head>
<body>
  <nav class="nav"><a class="brand" href="./">✦ Paws Arcana</a><a href="reading">Start your reading</a></nav>
  <main class="wrap" id="app"><div class="notice">공유 리딩을 불러오고 있어요…</div></main>
  <script src="../share.js?v=1"></script>
</body>
</html>
