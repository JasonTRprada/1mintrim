<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paws Arcana &mdash; Cat Tarot &amp; Fortune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#423757; --lav:#8370a8; --cream:#fffaf4; --peach:#f8e8dc; --line:#e9d8d0; --gold:#d4ad79; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--cream); font-family:"DM Sans","Noto Sans KR","Malgun Gothic",sans-serif; }
    .shell { overflow:hidden; background:radial-gradient(circle at 70% 9%, #f5eafb 0, transparent 23rem), linear-gradient(180deg,#fffdf9 0,#fff8f1 100%); }
    .nav { height:88px; max-width:1480px; margin:auto; padding:0 44px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { display:flex; gap:11px; align-items:center; font-family:"Playfair Display",serif; font-size:24px; letter-spacing:-1px; }

    .nav-links { display:flex; gap:34px; font-size:14px; }

    .button { border:0; border-radius:999px; background:var(--lav); color:white; padding:13px 22px; font:500 14px "DM Sans",sans-serif; box-shadow:inset 0 0 0 1px rgba(255,255,255,.45); }

    .hero-card.right { transform:translateX(220px) rotate(9deg); z-index:2; }

    .section-head { display:flex; justify-content:space-between; align-items:end; margin-bottom:32px; }

    .archive-feature .card { flex:0 0 190px; aspect-ratio:2/3; }

    .feature-copy h3 { margin:8px 0 9px; font:500 31px/1.08 "Playfair Display",serif; }

    .mini .card { width:100%; aspect-ratio:2/3; }
    .mini h3 { margin:12px 0 0; font:500 19px "Playfair Display",serif; }
    .mini p { margin:3px 0 0; color:#84758c; font-size:12px; }
    .reading { max-width:1480px; margin:auto; padding:70px 44px 88px; display:grid; grid-template-columns:31% 69%; align-items:center; }
    .reading p { max-width:320px; color:#6d6375; line-height:1.7; }
    .reading-cards { display:flex; justify-content:center; gap:28px; }
    .reading-cards .card { width:178px; aspect-ratio:2/3; transform:rotate(-5deg); }
    .reading-cards .card:nth-child(2) { transform:translateY(-19px); }
    .reading-cards .card:nth-child(3) { transform:rotate(5deg); }
    @media (max-width:900px) { .nav { padding:0 20px; }.nav-links{display:none}.hero{grid-template-columns:1fr;padding:54px 23px 30px}.hero-deck{margin-top:34px;height:420px;transform:scale(.78);transform-origin:center}.archive-inner,.reading{padding-left:23px;padding-right:23px}.archive-grid{grid-template-columns:repeat(2,1fr)}.archive-feature{grid-column:span 2}.reading{grid-template-columns:1fr}.reading-cards{margin-top:35px;gap:12px}.reading-cards .card{width:29vw} }
    .full-archive { background:#fffdf9; border-top:1px solid var(--line); }
    .full-archive-inner { max-width:1480px; margin:auto; padding:78px 44px 96px; }
    .filter-row { display:flex; flex-wrap:wrap; gap:9px; margin:32px 0; }
    .filter { border:1px solid #dfcdd7; background:#fff; color:#715f7d; border-radius:999px; padding:10px 16px; font:500 13px "DM Sans","Noto Sans KR","Malgun Gothic",sans-serif; cursor:pointer; }
    .filter.active,.filter:hover { background:var(--lav); color:#fff; border-color:var(--lav); }
    .card-gallery { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); column-gap:22px; row-gap:34px; }
    .gallery-card { border:0; background:none; padding:0; text-align:left; color:inherit; cursor:pointer; }
    .gallery-card .card { display:block; width:100%; aspect-ratio:2/3; transition:transform .22s ease,box-shadow .22s ease; }
    .gallery-card:hover .card { transform:translateY(-8px); box-shadow:0 23px 32px rgba(79,51,88,.25); }
    .gallery-card h3 { margin:11px 0 3px; font:500 19px/1.05 "Playfair Display",serif; }
    .gallery-card p { margin:0; color:#88778f; font-size:11px; }
    .text-button { font-family:"DM Sans","Noto Sans KR","Malgun Gothic",sans-serif; background:transparent; cursor:pointer; }
    .card-dialog { width:min(760px,calc(100vw - 36px)); border:0; border-radius:24px; padding:28px; display:none; grid-template-columns:270px 1fr; gap:30px; align-items:center; color:var(--ink); background:#fffaf4; box-shadow:0 24px 80px rgba(55,37,63,.35); }
    .card-dialog[open] { display:grid; }.card-dialog::backdrop { background:rgba(42,31,52,.48); backdrop-filter:blur(4px); }.card-dialog img { width:100%; border-radius:14px; box-shadow:0 15px 26px rgba(75,54,78,.2); }.card-dialog h2 { margin:10px 0 14px; }.card-dialog p { color:#6c6278; line-height:1.75; }.dialog-close { position:absolute; right:16px; top:13px; border:0; background:none; color:#8e7e92; font-size:30px; cursor:pointer; }
    @media(max-width:900px) { .full-archive-inner{padding-left:23px;padding-right:23px}.card-gallery{grid-template-columns:repeat(3,1fr)}.card-dialog{grid-template-columns:1fr;max-height:90vh;overflow:auto}.card-dialog img{max-width:230px;margin:auto} }    .detail-body { min-width:0; }.detail-keywords{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}.detail-keywords span{padding:6px 9px;border-radius:99px;background:#f1eaf8;color:#765b8d;font-size:11px}.detail-block{margin:18px 0 0}.detail-block h3{margin:0 0 7px;color:#a77e85;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.detail-block p{margin:0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.detail-grid .detail-block{padding-top:16px;border-top:1px solid #eadcd5}.detail-block.advice{padding:15px 16px;border-radius:14px;background:#f4edf8}.detail-block.advice h3{color:#806599}      .gate-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    .gate-actions .button { display:inline-block; text-decoration:none; }
    .gate-actions .button.alt { background:transparent; color:#705b8e; border:1px solid #b59cc6; box-shadow:none; }
    .gate-note { margin:20px 0 0; max-width:390px; color:#8a7c91; font-size:12px; line-height:1.6; }
    .gate-panel { max-width:1480px; margin:0 auto; padding:12px 44px 64px; }
    .gate-panel-inner { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .gate-link { min-height:180px; padding:28px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--line); border-radius:22px; color:inherit; text-decoration:none; background:rgba(255,255,255,.52); transition:transform .2s ease,box-shadow .2s ease; }
    .gate-link:hover { transform:translateY(-5px); box-shadow:0 18px 30px rgba(79,51,88,.12); }
    .gate-link h2 { font-size:32px; }.gate-link p { margin:10px 0 0; color:#6d6375; line-height:1.55; }.gate-link span { color:#806599; font-size:13px; font-weight:700; }
    .reading-shell { min-height:100vh; background:radial-gradient(circle at 70% 12%,#f5eafb 0,transparent 24rem),linear-gradient(180deg,#fffdf9 0,#fff8f1 100%); }
    .page-hero { max-width:1100px; margin:0 auto; padding:70px 44px 30px; text-align:center; }.page-hero h1 { margin:14px auto; }.page-hero p { max-width:510px; margin:0 auto; color:#6b6179; line-height:1.7; }
    .back-link { color:#705b8e; text-decoration:none; font-size:13px; }
    .reading-stage { max-width:1120px; margin:0 auto; padding:32px 44px 90px; }.reading-stage > p { text-align:center; color:#7e7088; }
    .reading-spread { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:26px; margin:34px auto; max-width:870px; }
    .reading-slot { min-height:420px; border:0; border-radius:18px; padding:13px; color:var(--ink); background:transparent; font:inherit; cursor:pointer; }.reading-slot:disabled{cursor:default}.reading-slot .slot-label{display:block;margin:0 0 12px;color:#9d7781;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.card-back,.reading-slot .card{width:100%;max-width:220px;aspect-ratio:2/3;margin:auto;border-radius:15px}.card-back{display:grid;place-items:center;background:linear-gradient(145deg,#8c74ad,#63527e);box-shadow:0 18px 32px rgba(79,51,88,.22);border:7px solid #e7d5b6;outline:1px solid #b69872;color:#fff;font:500 43px/1 "Playfair Display",serif}.reading-slot:hover .card-back{transform:translateY(-6px);transition:transform .2s ease}.reading-slot .card{overflow:hidden;box-shadow:0 18px 32px rgba(79,51,88,.2)}.reading-slot .card img{width:100%;height:100%;object-fit:cover}.slot-title{display:block;margin:12px auto 0;font:500 22px/1.1 "Playfair Display",serif}.slot-hint{display:block;max-width:220px;margin:7px auto 0;color:#776a83;font-size:12px;line-height:1.55}.reading-result{display:none;max-width:870px;margin:42px auto 0;padding:28px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.62)}.reading-result.show{display:block}.reading-result h2{font-size:34px}.reading-result p{color:#6d6375;line-height:1.75}.restart{display:block;margin:25px auto 0}.reading-link-button{border:0;cursor:pointer}
    @media(max-width:700px){.gate-panel{padding:10px 23px 45px}.gate-panel-inner{grid-template-columns:1fr}.gate-link{min-height:150px}.gate-actions{flex-direction:column;align-items:flex-start}.page-hero,.reading-stage{padding-left:23px;padding-right:23px}.reading-spread{gap:4px}.reading-slot{min-height:290px;padding:5px}.card-back,.reading-slot .card{max-width:100%;border-radius:11px}.card-back{border-width:4px;font-size:28px}.slot-title{font-size:15px}.slot-hint{font-size:10px}.reading-result{padding:20px}.reading-result h2{font-size:28px}}    .question-form { max-width:720px; margin:30px auto 0; padding:20px; border:1px solid var(--line); border-radius:20px; background:rgba(255,255,255,.64); text-align:left; }
    .question-form label { display:block; margin-bottom:9px; color:#705b8e; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .question-form textarea { display:block; width:100%; min-height:88px; resize:vertical; border:1px solid #dccad6; border-radius:14px; padding:13px 14px; color:var(--ink); background:#fffdfa; font:15px/1.6 "DM Sans","Noto Sans KR","Malgun Gothic",sans-serif; outline:none; }
    .question-form textarea:focus { border-color:var(--lav); box-shadow:0 0 0 3px rgba(131,112,168,.12); }
    .question-form-footer { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:12px; }.question-form small { color:#897c90; line-height:1.45; }.question-error { display:none; margin:9px 0 0; color:#b35866; font-size:12px; }.question-error.show { display:block; }
    .reading-spread[hidden] { display:none; }.reading-spread { align-items:start; margin-top:42px; }
    .reading-slot { min-height:0; display:flex; flex-direction:column; align-items:center; padding:0 8px 20px; }.reading-slot .slot-label { min-height:28px; text-align:center; }.card-back,.reading-slot .card { display:block; width:min(100%,260px); max-width:260px; aspect-ratio:2/3; margin:0 auto; border-radius:15px; }.card-back { display:grid; place-items:center; flex:0 0 auto; }.reading-slot .card { flex:0 0 auto; }.reading-slot .card img { display:block; }
    .slot-title { width:100%; min-height:48px; text-align:center; }.slot-hint { width:100%; max-width:260px; min-height:57px; text-align:center; }.reading-result { margin-top:50px; }.question-echo { margin:10px 0 20px; padding:13px 15px; border-left:3px solid #b79ccb; border-radius:0 12px 12px 0; background:#f4edf8; color:#655771; }
    @media(max-width:700px){.question-form{padding:16px}.question-form-footer{align-items:flex-start;flex-direction:column}.reading-spread{gap:5px;margin-top:30px}.reading-slot{padding:0 3px 15px}.card-back,.reading-slot .card{width:100%;border-radius:10px}.slot-title{min-height:38px;font-size:15px}.slot-hint{min-height:65px;font-size:10px}.reading-result{margin-top:28px}}    .codex-loading,.reading-api-error{margin:14px 0;padding:18px;border-radius:14px;background:#f4edf8;color:#655771;line-height:1.7}.codex-loading{font-weight:500}.dots{display:inline-block;min-width:20px;animation:pawsDots 1.1s steps(4,end) infinite}@keyframes pawsDots{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}.reading-api-error{background:#fff0ef;color:#9a5260}</style>
</head><body>
  <main class="reading-shell">
    <nav class="nav"><a class="brand" href="./" aria-label="Paws Arcana home"><span class="paw">&#10022;</span><span>Paws Arcana</span></a><div class="nav-links"><a href="deck">Deck</a><a href="./">Home</a></div><a class="button" href="deck">Explore the deck</a></nav>
    <section class="page-hero"><a class="back-link" href="./">&larr; Paws Arcana home</a><div class="eyebrow" style="margin-top:28px">Three-card reading</div><h1>Past, present, future.</h1><p>마음을 가다듬고 아래 세 장을 순서대로 눌러주세요. 이미 나온 카드는 다시 나오지 않습니다.</p></section>
    <section class="reading-stage">
  <form class="question-form" id="questionForm">
    <label for="readingQuestion">오늘의 질문</label>
    <textarea id="readingQuestion" maxlength="240" placeholder="예: 지금 이 관계에서 내가 먼저 알아야 할 것은 무엇일까?"></textarea>
    <div class="question-form-footer"><small>질문을 한 문장으로 적은 뒤 카드를 뽑아보세요.</small><button class="button reading-link-button" type="submit">질문을 정하고 카드 뽑기</button></div>
    <p class="question-error" id="questionError">카드에 묻고 싶은 질문을 먼저 적어주세요.</p>
  </form>
  <p id="readingPrompt">질문을 적고 시작해 주세요.</p>
  <div class="reading-spread" id="readingSpread" aria-live="polite" hidden></div>
  <div class="reading-result" id="readingResult"><div class="eyebrow">Your reading</div><h2>질문을 향한 세 장</h2><p class="question-echo" id="questionEcho"></p><div id="readingSummary"></div><button class="button reading-link-button restart" id="restartReading" type="button">새 질문으로 뽑기</button></div>
</section>
  </main>
